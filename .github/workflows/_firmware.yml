name: Build firmware

# Reusable workflow: compiles a given set of Arduino firmwares and uploads the
# flashable binary for each one.
#
# Firmwares are grouped by board so each toolchain core is installed exactly
# once (avr for mod1-*/hagiwo30-*, rp2040 for mod2-*). The `firmwares` input is
# a JSON array of firmware directory names, e.g. ["mod1-lfo","mod2-vco"]; each
# board job builds only the members that belong to it and no-ops otherwise.
#
# Flashable outputs, one per firmware:
#   mod1-*/hagiwo30-*  ->  <name>.hex   (arduino:avr:nano)
#   mod2-*             ->  <name>.uf2   (rp2040 seeed_xiao_rp2350)
on:
  workflow_call:
    inputs:
      firmwares:
        description: JSON array of firmware directory names to build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: avr
            regex: '^(mod1|hagiwo30)-'
            fqbn: arduino:avr:nano
            core: arduino:avr
            ext: hex
          - board: rp2040
            regex: '^mod2-'
            fqbn: rp2040:rp2040:seeed_xiao_rp2350
            core: rp2040:rp2040
            ext: uf2
    steps:
      - uses: actions/checkout@v4

      # Which of the requested firmwares belong to this board?
      - id: select
        run: |
          set -euo pipefail
          selected="$(printf '%s' '${{ inputs.firmwares }}' \
            | jq -r --arg re '${{ matrix.regex }}' '.[] | select(test($re))')"
          if [ -z "$selected" ]; then
            echo "No ${{ matrix.board }} firmwares in this build; skipping."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$selected"
          fi
          printf '%s\n' "$selected" > selected.txt

      - name: Set up arduino-cli
        if: steps.select.outputs.has == 'true'
        uses: arduino/setup-arduino-cli@v2

      # Cache the arduino data dir (installed cores/tools) across runs. The
      # rp2040 core in particular is large, so this saves several minutes.
      - name: Cache Arduino cores
        if: steps.select.outputs.has == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ matrix.board }}-${{ hashFiles('arduino-cli.yaml') }}-v1

      - name: Install ${{ matrix.core }} core
        if: steps.select.outputs.has == 'true'
        run: |
          set -euo pipefail
          arduino-cli --config-file arduino-cli.yaml core update-index
          arduino-cli --config-file arduino-cli.yaml core install ${{ matrix.core }}

      # Third-party libraries that live in the Arduino Library Manager (the
      # repo's own libraries are found via --libraries firmwares/shared). The
      # avr firmwares (hagiwo30-*) pull in display/encoder libraries.
      - name: Install external libraries (avr)
        if: steps.select.outputs.has == 'true' && matrix.board == 'avr'
        run: |
          set -euo pipefail
          arduino-cli --config-file arduino-cli.yaml lib install \
            Encoder \
            FastGPIO \
            "Adafruit GFX Library" \
            "Adafruit SSD1306"

      # The Mutable Instruments ports (mod2-tides / mod2-braids) need two
      # Library Manager libraries plus the poetaster/arduinoMI packaging of the
      # MI sources, fetched at the commits pinned in .github/mi-libs.env (they
      # are deliberately not vendored in this repo). TIDES additionally needs
      # the .cc -> .inc packaging fix documented in README.md ("MOD2 Braids /
      # Tides"): arduino-cli compiles the .cc sub-sources AND the tides_all.cpp
      # amalgamation, which fails to link with multiple-definition errors.
      - name: Install external libraries (rp2040)
        if: steps.select.outputs.has == 'true' && matrix.board == 'rp2040'
        run: |
          set -euo pipefail
          arduino-cli --config-file arduino-cli.yaml lib install \
            Bounce2 \
            RPI_PICO_TimerInterrupt
          source .github/mi-libs.env
          libdir="$HOME/Arduino/libraries"
          mkdir -p "$libdir"
          for spec in "STMLIB:${MI_STMLIB_SHA}" "BRAIDS:${MI_BRAIDS_SHA}" "TIDES:${MI_TIDES_SHA}"; do
            name="${spec%%:*}"; sha="${spec##*:}"
            curl -fsSL "https://github.com/poetaster/${name}/archive/${sha}.tar.gz" | tar xz -C "$libdir"
            mv "$libdir/${name}-${sha}" "$libdir/${name}"
          done
          cd "$libdir/TIDES/src"
          for f in resources poly_slope_generator ramp_extractor; do
            mv "tides2/$f.cc" "tides2/$f.inc"
          done
          sed -i -E 's#(tides2/[a-z_]+)\.cc#\1.inc#' tides_all.cpp

      # Build every requested firmware for this board. Individual compile
      # failures are tolerated and skipped (surfaced as warnings), mirroring the
      # root Makefile's `dist` target -- the repo intentionally ships some WIP
      # sketches that don't yet compile (e.g. the Mutable Instruments ports that
      # need un-vendored headers). The build fails only if none compile.
      - name: Compile firmwares
        if: steps.select.outputs.has == 'true'
        run: |
          set -uo pipefail
          mkdir -p artifacts
          built=""; failed=""
          while IFS= read -r fw; do
            [ -n "$fw" ] || continue
            echo "=== Building $fw (${{ matrix.fqbn }}) ==="
            if arduino-cli compile \
                --config-file arduino-cli.yaml \
                --fqbn "${{ matrix.fqbn }}" \
                --libraries firmwares/shared \
                --output-dir "out/$fw" \
                "firmwares/$fw"; then
              cp "out/$fw/$fw.ino.${{ matrix.ext }}" "artifacts/$fw.${{ matrix.ext }}"
              built="$built $fw"
            else
              echo "::warning title=firmware build skipped::$fw did not compile and was skipped"
              failed="$failed $fw"
            fi
          done < selected.txt
          echo ""
          echo "Built:$built"
          [ -n "$failed" ] && echo "Skipped (failed to compile):$failed" || true
          # Fail only if literally nothing built for this board.
          if [ -z "$built" ]; then
            echo "::error::No ${{ matrix.board }} firmware compiled."
            exit 1
          fi

      - name: Upload firmware artifacts
        if: steps.select.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: artifacts/*
          if-no-files-found: error
